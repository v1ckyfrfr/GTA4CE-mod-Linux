[SETTINGS]
; 1 = Mod Enabled, 0 = Mod Disabled
Enabled = 1

; Toggle key (Virtual Key Code)
; 0x56 = V key (default)
; 0x58 = X key
; 0x43 = C key
; 0x5A = Z key
; 0x70 = F1 key
; 0x71 = F2 key
; See: https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ToggleKey = 0x5A

; ========================================================
; SPEED BOOST SETTINGS
; ========================================================
; Speed multiplier for nearby vehicles (default: 5.0 = 5x normal speed)
; Higher values = faster vehicles
SpeedMultiplier = 5.0

; Radius around player to boost vehicles (in meters)
; Higher values = more vehicles affected = more performance cost
BoostRadius = 50

; Include player's own vehicle in speed boost (1 = Yes, 0 = No)
IncludePlayerVehicle = 0

; ========================================================
; FEEDBACK EFFECTS
; ========================================================
; Show notification when toggling
ShowNotification = 1

; Screen shake / camera jolt effect when toggling (1 = Yes, 0 = No)
ScreenShake = 1

; ========================================================
; USAGE
; ========================================================
; Press V (or configured key) to toggle vehicle speed boost
; While active:
;   - All nearby vehicles (within radius) will move at multiplied speed
;   - Vehicles maintain their direction but go much faster
;   - Press V again to deactivate and return vehicles to normal