[SETTINGS]
; 1 = Mod Enabled, 0 = Mod Disabled
Enabled = 1

; Toggle key (Virtual Key Code)
; 0x54 = T key (default)
; 0x58 = X key
; 0x43 = C key
; 0x5A = Z key
; 0x70 = F1 key
; 0x71 = F2 key
; See: https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ToggleKey = 0x54

; ========================================================
; FREEZE OPTIONS
; ========================================================
; Freeze pedestrians/NPCs in place
FreezeNPCs = 1

; Freeze vehicles in place
FreezeVehicles = 1

; Freeze game time scale (stops animations, physics, spawning)
; When enabled, the world essentially pauses except for player
FreezeTimeScale = 1

; Show notification when toggling
ShowNotification = 1

; Make frozen NPCs invincible (can't be damaged while frozen)
InvincibleWhenFrozen = 1

; Radius around player to freeze entities (in meters)
; Higher values = more entities frozen = more performance cost
FreezeRadius = 200

; ========================================================
; USAGE
; ========================================================
; Press T (or configured key) to toggle time freeze
; While frozen:
;   - NPCs stop moving, animating, attacking
;   - Vehicles stop moving
;   - Time scale stops (animations, particles, physics paused)
;   - Player can walk around freely
;   - Press T again to resume time