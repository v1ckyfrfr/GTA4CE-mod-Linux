[SETTINGS]
; 1 = Mod Enabled, 0 = Mod Disabled
Enabled = 1

; ========================================================
; TRIGGER MODE
; ========================================================
; 1 = PUNCH ONLY (Default: ONLY active when punching / left-click melee attack)
;     -> Walking & normal running will NOT cause people/vehicles to fly.
;     -> Once punched / hit, NPCs or Vehicles will immediately launch far away!
; 2 = SPRINT ONLY (Only active when sprinting / running into a target)
; 3 = BOTH (Can punch to launch, and can sprint into targets to launch)
TriggerMode = 1

; Minimum running speed if TriggerMode 2 or 3 is selected (3.5 = fast sprint)
MinRunningSpeed = 3.5

; ========================================================
; PUNCH / COLLISION SETTINGS FOR NPCs (PEDESTRIANS)
; ========================================================
; 1 = Enable effect on NPCs / Pedestrians
AffectNPC = 1

; Horizontal launch force on NPCs (how far they get thrown)
; Default: 38.0
LaunchForce = 38.0

; Upward launch force on NPCs (how high they fly into the air)
; Default: 9.5
UpwardForce = 9.5

; Ragdoll duration in milliseconds (6000 = 6 seconds)
RagdollDuration = 6000

; Direct health damage dealt to NPCs upon punch impact (0-100)
ImpactDamage = 40

; ========================================================
; PUNCH / COLLISION SETTINGS FOR VEHICLES (CARS, TRUCKS, BIKES)
; ========================================================
; 1 = Enable effect on Vehicles when punched / hit
AffectVehicles = 1

; Horizontal launch force on vehicles (how far the vehicle flies)
; Default: 75.0 (vehicles immediately fly off upon impact)
VehicleLaunchForce = 75.0

; Upward launch force on vehicles (makes vehicles fly / flip over)
; Default: 20.0
VehicleUpwardForce = 20.0

; Body damage dealt to vehicles when hit by a punch (0-1000)
VehicleDamage = 180

; ========================================================
; FEEDBACK EFFECTS
; ========================================================
; Screen shake / camera jolt effect when hitting (1 = Yes, 0 = No)
ScreenShake = 1
